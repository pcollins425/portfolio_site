# **`backend_live`** behind Cloudflare Tunnel (or local smoke test).
#
# Prerequisite: **`backend_live/.env`** from **`.env.example`** (ignored by Git).
# Assistant workspace mount defaults to **`../cursor_assistant`** (sibling folder).
# On DGS Slot Server the clone is often **`cursor-assistant`** — set **`ASSISTANT_WORKSPACE_HOST`**.
# Optional override: **`ASSISTANT_WORKSPACE_HOST`** in **`backend_live/.env`** when using
# **`docker compose --env-file backend_live/.env`** or **`scripts/deploy-backend-docker.sh`**.
#
# Typical (same machine as **`cloudflared`**):
#   docker compose --env-file backend_live/.env up -d --build
#
# **`backend_live/.env`:** media via **NAS CIFS mount** (preferred on slot server) or local bind fallback.
#
# Smoke test:
#   curl http://127.0.0.1:9001/health
#   curl http://127.0.0.1:9001/api/media/health

services:
  backend_live:
    build:
      context: ./backend_live
      dockerfile: Dockerfile
    container_name: portfolio_backend_live
    restart: unless-stopped
    # Bind to loopback only: tunnel / local callers on host use 127.0.0.1:9001
    ports:
      - "127.0.0.1:9001:9001"
    env_file:
      - ./backend_live/.env
    # Assistant: host clone → /workspace (default: sibling ../cursor_assistant)
    # Optional ASSISTANT_WORKSPACE_HOST in backend_live/.env — use:
    #   docker compose --env-file backend_live/.env up -d --build
    environment:
      ASSISTANT_WORKSPACE: /workspace
      ASSISTANT_SESSIONS_FILE: /app/data/assistant_sessions/assistant_sessions.json
      # FSR review Apply uses the same mounted checkout (override in .env if needed).
      FSR_APPLY_ROOT: ${FSR_APPLY_ROOT:-/workspace}
    volumes:
      # Host folder name may be cursor_assistant or cursor-assistant — set ASSISTANT_WORKSPACE_HOST.
      - ${ASSISTANT_WORKSPACE_HOST:-../cursor_assistant}:/workspace:rw
      - assistant_sessions:/app/data/assistant_sessions
      # NAS via WSL bind (NAS_MEDIA_WSL_BIND) or local mirror (MEDIA_ROOT_HOST). See mount_nas_media_wsl.cmd.
      - ${NAS_MEDIA_WSL_BIND:-${MEDIA_ROOT_HOST:-../portfolio_media/tableau-images}}:/media/tableau-images:ro

volumes:
  assistant_sessions:
