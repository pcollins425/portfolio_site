# **`backend_live`** behind Cloudflare Tunnel (or local smoke test).
#
# Prerequisite: **`backend_live/.env`** from **`.env.example`** (ignored by Git).
# Assistant workspace mount defaults to **`../cursor-assistant`** (sibling folder).
# Optional override: **`ASSISTANT_WORKSPACE_HOST`** in **`backend_live/.env`** when using
# **`docker compose --env-file backend_live/.env`** or **`scripts/deploy-backend-docker.sh`**.
#
# Typical (same machine as **`cloudflared`**):
#   docker compose --env-file backend_live/.env up -d --build
#
# **`backend_live/.env`:** `MEDIA_ROOT=/media/tableau-images` (container path) and
# **`MEDIA_ROOT_HOST`** (host folder outside this repo — see `scripts/sync_tableau_images.ps1`).
# Docker Desktop cannot bind-mount M:/ or UNC; sync NAS → `MEDIA_ROOT_HOST` instead.
#
# Smoke test:
#   curl http://127.0.0.1:9001/health

services:
  backend_live:
    build:
      context: ./backend_live
      dockerfile: Dockerfile
    container_name: portfolio_backend_live
    restart: unless-stopped
    # Bind to loopback only: tunnel / local callers on host use 127.0.0.1:9001
    ports:
      - "127.0.0.1:9001:9001"
    env_file:
      - path: ./backend_live/.env
        required: false
    # Assistant: host clone → /workspace (default: sibling ../cursor-assistant)
    # Optional ASSISTANT_WORKSPACE_HOST in backend_live/.env — use:
    #   docker compose --env-file backend_live/.env up -d --build
    environment:
      ASSISTANT_WORKSPACE: /workspace
      ASSISTANT_SESSIONS_FILE: /app/data/assistant_sessions/assistant_sessions.json
    volumes:
      - ${ASSISTANT_WORKSPACE_HOST:-../cursor-assistant}:/workspace:rw
      - assistant_sessions:/app/data/assistant_sessions
      # Contracts media — host path outside repo (MEDIA_ROOT_HOST in backend_live/.env).
      - ${MEDIA_ROOT_HOST:-../portfolio_media/tableau-images}:/media/tableau-images:ro

volumes:
  assistant_sessions:
