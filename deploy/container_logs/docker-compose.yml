# Monitor-only container logs.
# Joins the existing portfolio network so no new Docker subnet is created.
# The gate is not published on the host. The API forwards to it.

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: dgs_container_logs_socket
    restart: unless-stopped
    environment:
      POST: "0"
      CONTAINERS: "1"
      IMAGES: "1"
      INFO: "1"
      NETWORKS: "1"
      EVENTS: "1"
      EXEC: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      SECRETS: "0"
      SWARM: "0"
      VOLUMES: "0"
      PLUGINS: "0"
      ALLOW_START: "0"
      ALLOW_STOP: "0"
      ALLOW_RESTARTS: "0"
      ALLOW_PAUSE: "0"
      ALLOW_UNPAUSE: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  dozzle:
    image: amir20/dozzle:latest
    container_name: dgs_container_logs_dozzle
    restart: unless-stopped
    depends_on:
      - socket-proxy
    environment:
      DOZZLE_REMOTE_HOST: tcp://dgs_container_logs_socket:2375
      DOCKER_HOST: tcp://dgs_container_logs_socket:2375
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_SHELL: "false"
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_BASE: /dgs-container-logs
      DOZZLE_AUTH_PROVIDER: none

  gate:
    build: ./gate
    container_name: dgs_container_logs_gate
    restart: unless-stopped
    depends_on:
      - dozzle
    env_file:
      - ./secrets/.env
    environment:
      DOZZLE_URL: http://dgs_container_logs_dozzle:8080
      LOGS_AREA: dgs_container_logs
      LOGS_COOKIE: dgs_logs

networks:
  default:
    name: portfolio_site_default
    external: true
