<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Scanner test — Collins Media LLC</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #0f1419;
      color: #e6edf3;
      line-height: 1.45;
    }
    .wrap {
      max-width: 40rem;
      margin: 0 auto;
      padding: 1.25rem 1rem 2.5rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 0.35rem;
    }
    .sub {
      margin: 0 0 1.25rem;
      color: #8b949e;
      font-size: 0.92rem;
    }
    section {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    section h2 {
      margin: 0 0 0.75rem;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #8b949e;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #c9d1d9;
      margin-bottom: 0.4rem;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.75rem 0.85rem;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
      font-size: 1.05rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    input[type="text"]:focus {
      outline: 2px solid #388bfd;
      outline-offset: 1px;
    }
    .hint {
      margin: 0.55rem 0 0;
      font-size: 0.82rem;
      color: #8b949e;
    }
    #reader {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: #0d1117;
      min-height: 12rem;
    }
    #reader video {
      border-radius: 8px;
    }
    .last {
      margin-top: 0.25rem;
      padding: 1rem;
      border-radius: 8px;
      background: #0d1117;
      border: 1px dashed #30363d;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1.35rem;
      min-height: 3.25rem;
    }
    .last.empty {
      color: #6e7681;
      font-size: 0.95rem;
      font-family: inherit;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    li {
      padding: 0.55rem 0;
      border-bottom: 1px solid #21262d;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.95rem;
      word-break: break-all;
    }
    li:last-child { border-bottom: 0; }
    .meta {
      display: block;
      font-family: inherit;
      font-size: 0.75rem;
      color: #8b949e;
      margin-bottom: 0.15rem;
    }
    .err {
      color: #f85149;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }
    button {
      margin-top: 0.65rem;
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #e6edf3;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button:hover { background: #30363d; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Scanner test</h1>
    <p class="sub">Scan a barcode — phone camera or USB scanner. Shows the raw value only (no server).</p>

    <section>
      <h2>USB / keyboard scanner</h2>
      <label for="wedge">Click here, then scan</label>
      <input id="wedge" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text" placeholder="Waiting for scan…" />
      <p class="hint">Most USB scanners type the code and press Enter. This field stays focused for rapid scans.</p>
    </section>

    <section>
      <h2>Phone camera</h2>
      <div id="reader"></div>
      <p id="cam-status" class="hint">Starting camera…</p>
      <button type="button" id="cam-restart" hidden>Restart camera</button>
      <p id="cam-error" class="err" hidden></p>
    </section>

    <section>
      <h2>Last scan</h2>
      <div id="last" class="last empty">Nothing scanned yet.</div>
    </section>

    <section>
      <h2>History</h2>
      <ul id="history"></ul>
    </section>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    (function () {
      var lastEl = document.getElementById("last");
      var historyEl = document.getElementById("history");
      var wedge = document.getElementById("wedge");
      var camStatus = document.getElementById("cam-status");
      var camError = document.getElementById("cam-error");
      var camRestart = document.getElementById("cam-restart");
      var scanner = null;
      var history = [];

      function showValue(value, source) {
        var text = String(value || "").trim();
        if (!text) return;

        lastEl.textContent = text;
        lastEl.classList.remove("empty");

        var when = new Date().toLocaleTimeString();
        history.unshift({ text: text, source: source, when: when });
        if (history.length > 20) history.pop();

        historyEl.innerHTML = history
          .map(function (row) {
            return (
              '<li><span class="meta">' +
              row.when +
              " · " +
              row.source +
              '</span>' +
              row.text +
              "</li>"
            );
          })
          .join("");
      }

      wedge.addEventListener("keydown", function (event) {
        if (event.key !== "Enter") return;
        event.preventDefault();
        showValue(wedge.value, "USB / keyboard");
        wedge.value = "";
        wedge.focus();
      });

      wedge.focus();
      document.addEventListener("click", function (event) {
        if (event.target === wedge || event.target.closest("#reader")) return;
        wedge.focus();
      });

      function startCamera() {
        if (typeof Html5Qrcode === "undefined") {
          camStatus.textContent = "Camera library failed to load.";
          camError.hidden = false;
          camError.textContent = "Check network access to unpkg.com or try the USB field.";
          return;
        }

        camError.hidden = true;
        camRestart.hidden = true;
        camStatus.textContent = "Requesting camera permission…";

        scanner = new Html5Qrcode("reader");
        scanner
          .start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 150 }, aspectRatio: 1.0 },
            function (decoded) {
              showValue(decoded, "camera");
              camStatus.textContent = "Scanned. Point at another code to continue.";
            },
            function () {}
          )
          .then(function () {
            camStatus.textContent = "Camera live — point at a barcode or QR code.";
          })
          .catch(function (err) {
            camStatus.textContent = "Camera unavailable.";
            camError.hidden = false;
            camError.textContent = String(err && err.message ? err.message : err);
            camRestart.hidden = false;
          });
      }

      camRestart.addEventListener("click", function () {
        if (scanner) {
          scanner
            .stop()
            .catch(function () {})
            .finally(function () {
              scanner.clear();
              scanner = null;
              startCamera();
            });
          return;
        }
        startCamera();
      });

      startCamera();
    })();
  </script>
</body>
</html>
