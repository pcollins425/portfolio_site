<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — DGS Application</title>
  <link rel="stylesheet" href="assets/dgs.css" />
</head>
<body class="dgs-app">
  <aside class="dgs-sidebar" id="dgs-sidebar">
    <div class="dgs-sidebar-brand">
      <div class="dgs-brand-text">
        <span class="dgs-brand-eyebrow">Dynamic Gaming Solutions</span>
        <span class="dgs-brand-title">DGS Application</span>
      </div>
      <button type="button" id="dgs-rail-toggle" class="dgs-rail-toggle" aria-expanded="true" title="Collapse navigation">◧</button>
    </div>
    <nav class="dgs-sidebar-nav" id="dgs-app-nav" aria-label="Application"></nav>
    <div class="dgs-sidebar-account" id="sidebar-account" hidden>
      <span class="dgs-sidebar-user" id="user-label"></span>
      <button type="button" id="btn-sign-out" class="dgs-sidebar-signout">Sign out</button>
    </div>
  </aside>

  <div id="dgs-nav-flyout" class="dgs-nav-flyout" hidden></div>

  <div class="dgs-main">
    <header class="page-header">
      <p class="page-eyebrow">Master Revenue</p>
      <h1>Dashboards</h1>
      <p class="subtitle">Performance and finance views · <code>dashboard.vw_performance_report</code></p>
    </header>

    <nav class="dgs-subnav" id="dgs-dashboard-nav" aria-label="Dashboard views"></nav>

    <section class="dgs-panel dgs-dashboard-mount" id="dashboard-root" aria-live="polite">
      <p class="status" style="border: none; padding: 1rem;">Loading dashboards…</p>
    </section>
    <p class="status" id="dashboard-hint" hidden>
      Local dev: run <code>npm run dev:dgsapp</code> in <code>frontend/</code> (port 5174) plus
      <code>scripts/run-backend-local.sh</code>. Production: <code>npm run build:dgsapp</code>.
    </p>
  </div>

  <script src="assets/auth.js"></script>
  <script src="assets/shell.js"></script>
  <script>
    if (/localhost|127\.0\.0\.1/.test(location.hostname)) {
      document.getElementById("dashboard-hint").hidden = false;
    }
    DGS.boot("dashboard", () => DGS.initDashboardPage());
  </script>
</body>
</html>
