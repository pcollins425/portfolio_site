<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expenses — DGS Application</title>
  <link rel="stylesheet" href="assets/dgs.css" />
</head>
<body class="dgs-app">
  <aside class="dgs-sidebar" id="dgs-sidebar">
    <div class="dgs-sidebar-brand">
      <div class="dgs-brand-text">
        <span class="dgs-brand-eyebrow">Dynamic Gaming Solutions</span>
        <span class="dgs-brand-title">DGS Application</span>
      </div>
      <button type="button" id="dgs-rail-toggle" class="dgs-rail-toggle" aria-expanded="true" title="Collapse navigation">◧</button>
    </div>
    <nav class="dgs-sidebar-nav" id="dgs-app-nav" aria-label="Application"></nav>
    <div class="dgs-sidebar-account" id="sidebar-account" hidden>
      <span class="dgs-sidebar-user" id="user-label"></span>
      <button type="button" id="btn-sign-out" class="dgs-sidebar-signout">Sign out</button>
    </div>
  </aside>

  <div id="dgs-nav-flyout" class="dgs-nav-flyout" hidden></div>

  <div class="dgs-main">
    <header class="page-header">
      <p class="page-eyebrow">Finance</p>
      <h1>Expenses</h1>
      <p class="subtitle">Browse <code>finance.expenses</code> · detail drawer stays open while you pick another row</p>
    </header>

    <nav class="dgs-subnav" id="expenses-subnav" aria-label="Expenses views">
      <a href="expenses.html" class="active">My Expenses</a>
      <a href="expenses-mass-edit.html">Mass Edit</a>
      <a href="#" class="is-disabled" aria-disabled="true" title="Coming later">Reconciliation</a>
      <a href="#" class="is-disabled" aria-disabled="true" title="Coming later">Import Amex</a>
    </nav>

    <div id="error-box" class="error-box" hidden></div>

    <section class="browse-panel">
      <div class="toolbar expenses-toolbar">
        <input id="search-input" type="search" placeholder="Search ref, description, amount, GL…" autocomplete="off" />
        <label class="toolbar-field">
          <span class="toolbar-field__label">Cardholder</span>
          <select id="cardholder-select">
            <option value="">All cardholders</option>
          </select>
        </label>
        <label class="toolbar-field">
          <span class="toolbar-field__label">From</span>
          <input id="date-from" type="date" />
        </label>
        <label class="toolbar-field">
          <span class="toolbar-field__label">To</span>
          <input id="date-to" type="date" />
        </label>
        <button id="btn-apply" type="button" class="btn btn-primary">Apply</button>
        <button id="btn-prev" type="button" class="btn">Prev</button>
        <button id="btn-next" type="button" class="btn">Next</button>
      </div>
      <div class="grid-wrap">
        <table class="data-grid" id="expenses-table">
          <thead>
            <tr>
              <th>Ref</th>
              <th>Date</th>
              <th class="num">Amount</th>
              <th>Employee</th>
              <th>St</th>
              <th>Tribe</th>
              <th>Casino</th>
              <th>GL Account</th>
              <th>Description</th>
              <th>Rcpt</th>
              <th>Amex</th>
            </tr>
          </thead>
          <tbody id="expenses-tbody"></tbody>
          <tfoot id="expenses-tfoot"></tfoot>
        </table>
      </div>
      <div class="status" id="list-status"></div>
    </section>
  </div>

  <div class="detail-backdrop" id="detail-backdrop" hidden></div>

  <aside class="detail-drawer" id="detail-drawer" aria-hidden="true">
    <div class="detail-header">
      <div>
        <p class="detail-label">Expense</p>
        <h2 id="detail-title">—</h2>
        <p class="subtitle" id="detail-subtitle"></p>
      </div>
      <button type="button" id="btn-close-detail" class="icon-btn" aria-label="Close details">×</button>
    </div>
    <div class="detail-body">
      <div class="form-grid" id="detail-fields"></div>
    </div>
  </aside>

  <script src="assets/auth.js"></script>
  <script src="assets/shell.js"></script>
  <script src="assets/expenses.js"></script>
  <script>DGS.boot("expenses", () => ExpensesApp.init());</script>
</body>
</html>
