<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Truck — DGS Application</title>
  <link rel="stylesheet" href="assets/dgs.css" />
  <link rel="stylesheet" href="assets/dgs-v2.css" />
</head>
<body class="dgs-app dgs-truck-inventory-v2">
  <aside class="dgs-sidebar" id="dgs-sidebar">
    <div class="dgs-sidebar-brand">
      <div class="dgs-brand-text">
        <span class="dgs-brand-eyebrow">Dynamic Gaming Solutions</span>
        <span class="dgs-brand-title">DGS Application</span>
      </div>
      <button type="button" id="dgs-rail-toggle" class="dgs-rail-toggle" aria-expanded="true" title="Collapse navigation">◧</button>
    </div>
    <nav class="dgs-sidebar-nav" id="dgs-app-nav" aria-label="Application"></nav>
    <div class="dgs-sidebar-account" id="sidebar-account" hidden>
      <span class="dgs-sidebar-user" id="user-label"></span>
      <button type="button" id="btn-sign-out" class="dgs-sidebar-signout">Sign out</button>
    </div>
  </aside>

  <div id="dgs-nav-flyout" class="dgs-nav-flyout" hidden></div>

  <div class="dgs-main dgs-v2-main">
    <header class="dgs-v2-page-header">
      <div>
        <p class="dgs-v2-eyebrow">Inventory · vehicle stock</p>
        <h1>Truck</h1>
        <p class="dgs-v2-subtitle">Read-only stock on your vehicle from AppSheet Locations + <code>stock_balance</code></p>
      </div>
    </header>

    <div id="error-box" class="dgs-v2-error" hidden></div>

    <div class="dgs-v2-toolbar dgs-truck-toolbar">
      <label class="dgs-truck-vehicle-pick" id="vehicle-pick-wrap" hidden>
        <span class="dgs-wo-field-label">Vehicle</span>
        <select id="vehicle-select" class="dgs-v2-input" aria-label="Vehicle"></select>
      </label>
      <div class="dgs-truck-vehicle-meta" id="vehicle-meta">Loading vehicle…</div>
      <input id="search-input" type="search" placeholder="Part #, description, mfr…" autocomplete="off" />
      <button id="search-btn" type="button" class="dgs-v2-btn dgs-v2-btn--primary">Search</button>
      <button id="clear-search" type="button" class="dgs-v2-btn">Clear</button>
    </div>

    <div class="dgs-v2-metrics" id="stat-row" aria-label="Truck summary">
      <div class="dgs-v2-metric">
        <div class="dgs-v2-metric-label">Lines on truck</div>
        <div class="dgs-v2-metric-value" id="stat-count">—</div>
      </div>
      <div class="dgs-v2-metric">
        <div class="dgs-v2-metric-label">Vehicle</div>
        <div class="dgs-v2-metric-value" id="stat-vehicle">—</div>
      </div>
    </div>

    <section class="dgs-v2-list-panel dgs-truck-panel">
      <div class="dgs-v2-grid-wrap">
        <table class="dgs-v2-grid" id="truck-table">
          <thead>
            <tr>
              <th>Item</th>
              <th>Description</th>
              <th class="dgs-v2-col--desktop">Mfr</th>
              <th>Condition</th>
              <th class="dgs-v2-bin-qty">Qty</th>
            </tr>
          </thead>
          <tbody id="truck-tbody"></tbody>
        </table>
      </div>
      <div class="dgs-v2-list-status" id="list-status"></div>
    </section>
  </div>

  <script src="assets/auth.js"></script>
  <script src="assets/shell.js"></script>
  <script src="assets/truck-inventory.js"></script>
  <script>DGS.boot("truck_inventory", () => TruckInventoryApp.init());</script>
</body>
</html>
