<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Theme hub — DGS Application</title>
  <link rel="stylesheet" href="assets/dgs.css" />
  <link rel="stylesheet" href="assets/dgs-v2.css" />
  <style>
    .th-form { display: grid; gap: 10px; margin-top: 12px; }
    .th-form label { display: grid; gap: 4px; font-size: .85rem; }
    .th-form input, .th-form select {
      background: #1a2030;
      color: inherit;
      border: 1px solid #2c3548;
      border-radius: 6px;
      padding: 6px 8px;
    }
    .th-note { color: #9aa3b2; font-size: .85rem; }
    .th-perf-chart { width: 100%; height: auto; display: block; }
    .th-perf-summary { margin: 14px 0 0; }
    .th-perf-summary p { margin: 0 0 8px; color: #c5cdd9; font-size: .95rem; line-height: 1.45; }
    .th-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    .th-table th, .th-table td { text-align: left; padding: 4px 6px; border-bottom: 1px solid #2c3548; vertical-align: top; }
    .th-picks { list-style: none; margin: 6px 0 0; padding: 0; }
    .th-picks button { background: none; border: 0; color: #8eb6ff; cursor: pointer; padding: 2px 0; }
    .th-add-only .dgs-v2-hub-body { display: block; }
    .th-add-only .dgs-v2-hub-media { display: none; }
    .th-add-only .dgs-v2-hub-grid { display: none; }
  </style>
</head>
<body class="dgs-app dgs-theme-hub">
  <aside class="dgs-sidebar" id="dgs-sidebar">
    <div class="dgs-sidebar-brand">
      <div class="dgs-brand-text">
        <span class="dgs-brand-eyebrow">Dynamic Gaming Solutions</span>
        <span class="dgs-brand-title">DGS Application</span>
      </div>
      <button type="button" id="dgs-rail-toggle" class="dgs-rail-toggle" aria-expanded="true" title="Collapse navigation">◧</button>
    </div>
    <nav class="dgs-sidebar-nav" id="dgs-app-nav" aria-label="Application"></nav>
    <div class="dgs-sidebar-account" id="sidebar-account" hidden>
      <span class="dgs-sidebar-user" id="user-label"></span>
      <button type="button" id="btn-sign-out" class="dgs-sidebar-signout">Sign out</button>
    </div>
  </aside>

  <div id="dgs-nav-flyout" class="dgs-nav-flyout" hidden></div>

  <div class="dgs-main dgs-v2-main dgs-v2-hub-main">
    <div id="error-box" class="dgs-v2-error" hidden></div>

    <div class="dgs-v2-hub-body" id="hub-body" hidden>
      <aside class="dgs-v2-hub-media" aria-label="Theme">
        <div class="dgs-v2-hub-media-inner">
          <div class="dgs-v2-image-caption">
            <div class="label">Theme</div>
            <div class="title" id="caption-title">—</div>
            <div class="meta mono" id="caption-id">—</div>
            <div class="meta" id="caption-meta">—</div>
          </div>
        </div>
      </aside>

      <main class="dgs-v2-hub-cells">
        <header class="dgs-v2-hub-header">
          <div>
            <p class="dgs-v2-eyebrow dgs-v2-desktop-only">Reference view</p>
            <h1>Theme hub</h1>
            <p class="dgs-v2-subtitle dgs-v2-desktop-only" id="hub-subtitle">theme-hub.html</p>
          </div>
        </header>
        <div id="add-root"></div>
        <div class="dgs-v2-hub-grid" id="hub-grid"></div>
      </main>
    </div>

    <div class="dgs-v2-hub-loading" id="hub-loading">Loading theme hub…</div>
  </div>

  <script src="assets/auth.js"></script>
  <script src="assets/shell.js"></script>
  <script src="assets/theme-hub.js"></script>
  <script>DGS.boot("project_workbench", () => ThemeHub.init());</script>
</body>
</html>
