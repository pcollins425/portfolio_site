<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Project Workbench — DGS Application</title>
  <link rel="stylesheet" href="assets/dgs.css" />
  <link rel="stylesheet" href="assets/dgs-v2.css" />
  <style>
    body.dgs-pwb.dgs-app {
      height: 100vh;
      overflow: hidden;
      color-scheme: dark;
    }
    body.dgs-pwb .dgs-v2-main {
      display: flex;
      flex-direction: column;
      padding: 20px 24px 28px;
      gap: 14px;
      background: var(--dgs-v2-bg, #0e1117);
      color: var(--dgs-v2-text, #c5cdd9);
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .pwb-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .pwb-toolbar input, .pwb-toolbar select {
      background: #12161e;
      color: #e8ecf2;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
      min-width: 140px;
    }
    .pwb-toolbar input[type="search"] { flex: 1; min-width: 180px; }
    .pwb-layout {
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr;
      gap: 14px;
      flex: 1;
      min-height: 0;
    }
    @media (max-width: 980px) {
      .pwb-layout { grid-template-columns: 1fr; overflow-y: auto; }
    }
    .pwb-panel {
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      background: rgba(0,0,0,.22);
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pwb-panel-h {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      font-size: .85rem;
      color: #9aa3b2;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .pwb-list, .pwb-detail {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
      min-height: 0;
    }
    .pwb-item {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid rgba(255,255,255,.06);
      background: transparent;
      color: inherit;
      padding: 12px 14px;
      cursor: pointer;
      font: inherit;
    }
    .pwb-item:hover { background: rgba(255,255,255,.04); }
    .pwb-item.active { background: rgba(25, 103, 210, .18); }
    .pwb-item .rk { font-weight: 600; color: #e8ecf2; }
    .pwb-item .meta { font-size: .8rem; color: #9aa3b2; margin-top: 4px; }
    .pwb-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: .72rem;
      background: rgba(255,255,255,.08);
      margin-right: 4px;
    }
    .pwb-badge.draft { background: rgba(255,255,255,.08); }
    .pwb-badge.pre_check { background: rgba(250,180,40,.2); color: #f0c14b; }
    .pwb-badge.blocked { background: rgba(220,80,80,.2); color: #f07178; }
    .pwb-badge.ready { background: rgba(46,160,67,.2); color: #3dd68c; }
    .pwb-badge.final_approved { background: rgba(46,160,67,.2); color: #3dd68c; }
    .pwb-badge.worksheet_issued { background: rgba(25,103,210,.25); color: #9ec1ff; }
    .pwb-badge.done { background: rgba(255,255,255,.08); color: #9aa3b2; }
    .pwb-stages {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      list-style: none;
      margin: 12px 0 0;
      padding: 0;
    }
    .pwb-stages li {
      padding: 6px 12px;
      font-size: .78rem;
      color: #6d7684;
      border-bottom: 2px solid rgba(255,255,255,.08);
    }
    .pwb-stages li.done { color: #9aa3b2; }
    .pwb-stages li.current {
      color: #e8ecf2;
      border-bottom-color: #f0c14b;
      font-weight: 600;
    }
    .pwb-stage-note { color: #9aa3b2; font-size: .88rem; margin: 8px 0 0; }
    .pwb-actions button:disabled { opacity: .45; cursor: not-allowed; }
    .pwb-detail { padding: 14px 16px 24px; }
    .pwb-detail h2 { margin: 0 0 6px; font-size: 1.15rem; color: #e8ecf2; }
    .pwb-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 18px; }
    .pwb-section { margin: 18px 0 8px; font-size: .8rem; color: #9aa3b2; text-transform: uppercase; letter-spacing: .04em; }
    .pwb-table { width: 100%; border-collapse: collapse; font-size: .86rem; }
    .pwb-table th, .pwb-table td {
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding: 8px 6px;
      text-align: left;
      vertical-align: top;
    }
    .pwb-table th { color: #9aa3b2; font-weight: 500; }
    .pwb-table input, .pwb-table select {
      width: 100%;
      max-width: 180px;
      background: #12161e;
      color: #e8ecf2;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 5px;
      padding: 5px 7px;
      font: inherit;
    }
    .pwb-check-select {
      max-width: 96px;
      font-size: .75rem;
      padding: 3px 4px;
    }
    .pwb-table .theme-cell { min-width: 160px; }
    .pwb-empty { color: #9aa3b2; padding: 28px 12px; }
    .pwb-tbd, .pwb-temp { color: #f0c14b; }
    .pwb-removed { color: #e07a7a; font-style: italic; font-size: .85rem; }
    .pwb-sw.temp { color: #f0c14b; }
    .pwb-sw { display: inline-block; margin-top: 4px; font-size: .72rem; }
    .pwb-sw.confirmed { color: #3dd68c; }
    .pwb-sw.need_software { color: #f0c14b; }
    .pwb-hub-link, .pwb-add-doc { display: block; margin-top: 4px; font-size: .75rem; }
    .pwb-theme-results {
      position: static;
      z-index: 20;
      margin-top: 4px;
      background: #161b24;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 6px;
      max-height: 200px;
      overflow: auto;
      min-width: 220px;
      box-shadow: 0 8px 24px rgba(0,0,0,.45);
    }
    .pwb-theme-results button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: #e8ecf2;
      padding: 8px 10px;
      font: inherit;
      cursor: pointer;
    }
    .pwb-theme-results button:hover { background: rgba(25,103,210,.25); }
    .pwb-theme-results button:disabled {
      color: #9aa3b2;
      cursor: not-allowed;
    }
    .pwb-theme-results button:disabled:hover { background: transparent; }
    .pwb-rel { position: relative; }
    .pwb-summary-list { margin: 0; padding-left: 18px; color: #c5cdd9; font-size: .9rem; }
    .pwb-summary-list li { margin: 4px 0; }
    .pwb-notes {
      white-space: pre-wrap;
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: .88rem;
      color: #c5cdd9;
      min-height: 2.5em;
    }
    .pwb-history { font-size: .8rem; color: #9aa3b2; margin: 0; padding: 0; list-style: none; }
    .pwb-history li { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
    body.pwb-edit-mode .pwb-browse { display: none; }
    body.pwb-edit-mode .pwb-edit { display: flex; }
    .pwb-edit {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      gap: 12px;
    }
    .pwb-edit-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .pwb-edit-layout {
      display: grid;
      grid-template-columns: minmax(420px, 1.1fr) minmax(320px, 0.9fr);
      gap: 14px;
      flex: 1;
      min-height: 0;
    }
    @media (max-width: 1100px) {
      .pwb-edit-layout { grid-template-columns: 1fr; overflow-y: auto; }
    }
    .pwb-edit-fields, .pwb-edit-doc {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
      min-height: 0;
      /* No top padding — sticky thead must sit flush or scrolled rows bleed above it */
      padding: 0 0 20px;
    }
    .pwb-edit-doc {
      padding: 12px 14px 20px;
      display: flex;
      flex-direction: column;
    }
    .pwb-edit-table {
      width: 100%;
      /* separate required for reliable sticky <th> (collapse leaves a scroll gap) */
      border-collapse: separate;
      border-spacing: 0;
      font-size: .88rem;
      table-layout: fixed;
    }
    .pwb-edit-table th, .pwb-edit-table td {
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding: 8px 8px;
      text-align: left;
      vertical-align: top;
    }
    .pwb-edit-table th:first-child,
    .pwb-edit-table td:first-child { padding-left: 14px; }
    .pwb-edit-table th:last-child,
    .pwb-edit-table td:last-child { padding-right: 14px; }
    .pwb-edit-setup-row td { padding-left: 14px; padding-right: 14px; }
    .pwb-edit-table th {
      color: #9aa3b2;
      font-weight: 500;
      font-size: .75rem;
      position: sticky;
      top: 0;
      background: #161b24;
      z-index: 3;
      box-shadow: 0 1px 0 rgba(255,255,255,.1);
    }
    .pwb-edit-fields .pwb-actions {
      padding: 12px 14px 0;
    }
    .pwb-edit-table input,
    .pwb-edit-table select {
      width: 100%;
      max-width: none;
      box-sizing: border-box;
      background: #12161e;
      color: #e8ecf2;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 5px;
      padding: 6px 8px;
      font: inherit;
      font-size: .86rem;
    }
    .pwb-edit-table col.c-op { width: 7.5rem; }
    .pwb-edit-table col.c-serial { width: 6.5rem; }
    .pwb-edit-table col.c-cab { width: 8.5rem; }
    .pwb-edit-table col.c-theme { width: auto; }
    .pwb-edit-table col.c-zbl { width: 3.4rem; }
    .pwb-edit-table col.c-del { width: 2.6rem; }
    .pwb-del-line {
      border: 0;
      background: transparent;
      color: #e07a7a;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 4px 6px;
      border-radius: 4px;
    }
    .pwb-del-line:hover { background: rgba(220, 80, 80, .18); }
    .pwb-edit-table .theme-meta {
      margin-top: 4px;
      font-size: .72rem;
      color: #9aa3b2;
    }
    .pwb-edit-setup-row td {
      padding-top: 0;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }
    .pwb-edit-setup {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 2px 0 4px;
    }
    .pwb-edit-setup label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: .7rem;
      color: #6d7684;
    }
    .pwb-edit-setup input {
      width: 100%;
      box-sizing: border-box;
      background: #12161e;
      color: #e8ecf2;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 5px;
      padding: 5px 7px;
      font: inherit;
      font-size: .8rem;
    }
    .pwb-doc-frame {
      background: #f4f1ea;
      color: #1a1a1a;
      border-radius: 6px;
      padding: 28px 32px;
      min-height: 420px;
      font-family: "Georgia", "Times New Roman", serif;
      font-size: 13px;
      line-height: 1.45;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
    }
    .pwb-doc-frame h3 {
      margin: 0 0 12px;
      font-size: 15px;
      letter-spacing: .02em;
      text-align: center;
      font-family: inherit;
    }
    .pwb-doc-meta { margin: 0 0 2px; }
    .pwb-doc-letter { margin: 16px 0; }
    .pwb-doc-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 11px;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .pwb-doc-table th, .pwb-doc-table td {
      border: 1px solid #333;
      padding: 4px 6px;
      text-align: left;
      vertical-align: top;
    }
    .pwb-doc-table th { background: #e8e4dc; }
    .pwb-doc-hint {
      margin: 0 0 8px;
      font-size: .75rem;
      color: #9aa3b2;
      font-family: system-ui, sans-serif;
    }
    .pwb-wordcraft-shell {
      flex: 1;
      min-height: 420px;
      height: min(70vh, 820px);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.1);
      background: #1a1a1a;
    }
    .pwb-wordcraft-shell iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #e6e6e6;
    }
    .pwb-doc-fallback { margin-top: 10px; }
    .pwb-sync {
      font-size: .75rem;
      color: #9aa3b2;
      margin-left: auto;
    }
    .pwb-sync.pending { color: #f0c14b; }
    .pwb-sync.ok { color: #3dd68c; }
    .pwb-sync.err { color: #f07178; }
  </style>
</head>
<body class="dgs-app dgs-pwb">
  <aside class="dgs-sidebar" id="dgs-sidebar">
    <div class="dgs-sidebar-brand">
      <div class="dgs-brand-text">
        <span class="dgs-brand-eyebrow">Dynamic Gaming Solutions</span>
        <span class="dgs-brand-title">DGS Application</span>
      </div>
      <button type="button" id="dgs-rail-toggle" class="dgs-rail-toggle" aria-expanded="true" title="Collapse navigation">◧</button>
    </div>
    <nav class="dgs-sidebar-nav" id="dgs-app-nav" aria-label="Application"></nav>
    <div class="dgs-sidebar-account" id="sidebar-account" hidden>
      <span class="dgs-sidebar-user" id="user-label"></span>
      <button type="button" id="btn-sign-out" class="dgs-sidebar-signout">Sign out</button>
    </div>
  </aside>

  <div id="dgs-nav-flyout" class="dgs-nav-flyout" hidden></div>

  <div class="dgs-main dgs-v2-main">
    <header class="dgs-v2-page-header">
      <div>
        <p class="dgs-v2-eyebrow">Operations</p>
        <h1>Project Workbench</h1>
        <p class="dgs-v2-subtitle">Active proposals — browse detail, edit draft with live document preview</p>
      </div>
    </header>

    <div id="error-box" class="dgs-v2-error" hidden></div>

    <div class="pwb-browse" id="pwb-browse">
      <div class="pwb-toolbar">
        <input type="search" id="q" placeholder="Search ref / casino" />
        <select id="stage-filter">
          <option value="active" selected>Active (not done)</option>
          <option value="">All stages</option>
          <option value="draft">draft</option>
          <option value="pre_check">pre_check</option>
          <option value="final_approved">final_approved</option>
          <option value="worksheet_issued">worksheet_issued</option>
          <option value="done">done</option>
        </select>
        <button type="button" class="dgs-v2-btn" id="btn-refresh">Refresh</button>
      </div>

      <div class="pwb-layout">
        <div class="pwb-panel">
          <div class="pwb-panel-h"><span>Proposals</span><span id="list-count"></span></div>
          <div class="pwb-list" id="list-root"></div>
        </div>
        <div class="pwb-panel">
          <div class="pwb-panel-h"><span>Detail</span><span id="write-hint"></span></div>
          <div class="pwb-detail" id="detail-root">
            <p class="pwb-empty">Select a proposal.</p>
          </div>
        </div>
      </div>
    </div>

    <div class="pwb-edit" id="pwb-edit" hidden>
      <div class="pwb-edit-bar">
        <button type="button" class="dgs-v2-btn" id="btn-exit-edit">← Back to detail</button>
        <strong id="edit-ref-label"></strong>
        <span class="pwb-sync" id="edit-sync">idle</span>
      </div>
      <div class="pwb-edit-layout">
        <div class="pwb-panel">
          <div class="pwb-panel-h"><span>Convert lines</span><span>SQL → document</span></div>
          <div class="pwb-edit-fields" id="edit-fields-root"></div>
        </div>
        <div class="pwb-panel">
          <div class="pwb-panel-h"><span>Conversion request</span><span>WordCraft</span></div>
          <div class="pwb-edit-doc" id="edit-doc-root"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/auth.js"></script>
  <script src="assets/shell.js"></script>
  <script src="assets/project-workbench.js"></script>
  <script>
    DGS.boot("project_workbench", () => ProjectWorkbench.init());
  </script>
</body>
</html>
