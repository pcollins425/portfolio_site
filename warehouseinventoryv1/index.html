<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Warehouse Inventory — DGS</title>
  <link rel="stylesheet" href="assets/warehouse.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <div>
        <p class="eyebrow">Dynamic Gaming Solutions</p>
        <h1>Warehouse Inventory</h1>
        <p class="sub">Live from eMaint COMPINFO · <span id="grand-total">—</span> assets across warehouses</p>
      </div>
    </header>

    <div id="error-box" class="error" hidden></div>

    <section class="section">
      <h2 class="section__title">Totals by warehouse</h2>
      <div id="summary-grid" class="summary-grid"></div>
    </section>

    <section class="section">
      <div id="warehouse-tabs" class="tabs" role="tablist" aria-label="Warehouses"></div>

      <div id="warehouse-panel" class="panel" hidden>
        <div class="panel__head">
          <h2 id="panel-title" class="panel__title"></h2>
          <p class="panel__hint">Cabinet counts for selected warehouse</p>
        </div>

        <div id="cabinet-summary" class="cabinet-summary"></div>

        <div class="toolbar">
          <label class="search" for="search-input">
            <span class="search__label">Search</span>
            <input id="search-input" type="search" placeholder="Serial, manufacturer, cabinet, previous location…" autocomplete="off" />
          </label>
          <div class="toolbar__actions">
            <button id="search-btn" type="button" class="btn btn--primary">Search</button>
            <button id="clear-search" type="button" class="btn">Clear</button>
          </div>
        </div>

        <p id="status-line" class="status-line"></p>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Serial</th>
                <th>Manufacturer</th>
                <th>Cabinet</th>
                <th>Date Received</th>
                <th>Previous Location</th>
              </tr>
            </thead>
            <tbody id="asset-tbody"></tbody>
          </table>
        </div>

        <div id="pager" class="pager" hidden>
          <button id="prev-page" type="button" class="btn">Previous</button>
          <span class="pager__label">Page 1 of 1</span>
          <button id="next-page" type="button" class="btn">Next</button>
        </div>
      </div>
    </section>
  </div>

  <script src="assets/warehouse.js"></script>
</body>
</html>
